{% extends 'base.html' %}
{% block title %}500 Server Error — Tulunad Homestay{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-icon">⚠️</div>
        <h1 class="error-code">500</h1>
        <h2 class="error-title">Something Went Wrong</h2>
        <p class="error-desc">We encountered an unexpected error processing your request. Please try again or return to the homepage.</p>
        <div class="hero-actions">
            <a href="{{ url_for('home') }}" class="btn btn-primary">Go Home</a>
            <a href="{{ url_for('user.rooms') }}" class="btn btn-outline">Browse Cottages</a>
        </div>
    </div>
</div>
{% endblock %}
